[project]
name = "rag-assistant"
version = "0.1.0"
description = "Production RAG Knowledge Assistant"
requires-python = ">=3.11,<3.12"
readme = "README.md"

# Phase 1 (project foundation) + Phase 2 (ingestion, parsing, chunking,
# embeddings) dependencies. Retrieval, generation, and evaluation
# dependencies (anthropic, rank-bm25, ragas) remain deferred to the
# phases that introduce them, per docs/IMPLEMENTATION_PLAN.md.
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    # Pinned explicitly (not left to passlib's [bcrypt] extra, which has no
    # upper bound): passlib 1.7.4's internal self-test passes a >72-byte
    # dummy secret to bcrypt. bcrypt<4.1 silently truncated at 72 bytes;
    # bcrypt>=4.1 raises ValueError instead, breaking every password
    # verification. Confirmed by running the test suite locally.
    "bcrypt==4.0.1",
    # Required by FastAPI/Starlette to parse Form(...) fields for
    # POST /auth/token, which README.md documents as form-encoded.
    # Pulled forward from its originally-planned Phase 2 introduction
    # (multipart file upload) because Phase 1 needs it too.
    "python-multipart==0.0.12",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    "structlog==24.4.0",

    # --- Phase 2: ingestion, parsing, chunking, embeddings ---
    "pdfplumber==0.11.4",
    "python-docx==1.1.2",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "nltk==3.9.1",
    "tiktoken==0.8.0",
    "openai==1.55.3",
    # Pinned explicitly even though it's only a transitive dependency of
    # pgvector: numpy>=2.1's shipped type stubs use PEP 695 `type X = ...`
    # syntax that requires targeting Python 3.12+, conflicting with this
    # project's Python 3.11 constraint (SRS §6) and breaking `mypy`.
    # Confirmed by running mypy locally.
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "ruff==0.8.0",
    "mypy==1.13.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "jose.*",
    "pgvector.*",
    "pdfplumber.*",
    "docx.*",
    "docx.opc.*",
    "bs4.*",
    "nltk.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicit default (rather than relying on pytest-asyncio's own default,
# which it warns is changing in a future release). Function-scoped loops
# are fine here because _fresh_db_engine_per_test (tests/conftest.py)
# creates a new DB engine per test regardless of loop scope, so there's
# no cross-test event-loop/connection mismatch to guard against.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

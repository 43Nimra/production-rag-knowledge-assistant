[project]
name = "rag-assistant"
version = "0.1.0"
description = "Production RAG Knowledge Assistant"
requires-python = ">=3.11,<3.12"
readme = "README.md"

# Phase 1 (project foundation) + Phase 2 (ingestion, parsing, chunking,
# embeddings) dependencies. Retrieval, generation, and evaluation
# dependencies (anthropic, rank-bm25, ragas) remain deferred to the
# phases that introduce them, per docs/IMPLEMENTATION_PLAN.md.
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    # Pinned explicitly (not left to passlib's [bcrypt] extra, which has no
    # upper bound): passlib 1.7.4's internal self-test passes a >72-byte
    # dummy secret to bcrypt. bcrypt<4.1 silently truncated at 72 bytes;
    # bcrypt>=4.1 raises ValueError instead, breaking every password
    # verification. Confirmed by running the test suite locally.
    "bcrypt==4.0.1",
    # Required by FastAPI/Starlette to parse Form(...) fields for
    # POST /auth/token, which README.md documents as form-encoded.
    # Pulled forward from its originally-planned Phase 2 introduction
    # (multipart file upload) because Phase 1 needs it too.
    "python-multipart==0.0.12",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    "structlog==24.4.0",

    # --- Phase 2: ingestion, parsing, chunking, embeddings ---
    "pdfplumber==0.11.4",
    "python-docx==1.1.2",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "nltk==3.9.1",
    "tiktoken==0.8.0",
    "openai==1.55.3",
    # Local/offline embedding alternative (ADR-003's documented
    # extension point for zero-cost or data-privacy-constrained
    # deployments). Pulls in torch as a transitive dependency — this is a
    # deliberate, documented trade-off against ADR-006's small-image goal,
    # not an oversight (see docker/Dockerfile's comment on the same line).
    "sentence-transformers==3.3.1",
    # Pinned explicitly for reproducibility, even though it's only a
    # transitive dependency (pgvector, and now scipy/scikit-learn via
    # sentence-transformers). MUST stay below 2.5.0: numpy 2.5.0+ requires
    # Python >=3.12 and has no wheel for Python 3.11 at all — this broke
    # the actual Docker build (python:3.11-slim) with "No matching
    # distribution found for numpy==2.5.3", caught only when the user
    # built the real image, not in my own sandbox verification (which
    # runs Python 3.12 and so never exercised the 3.11 install path).
    # 2.2.6 is the latest 2.x release confirmed to have a cp311 wheel for
    # linux/aarch64 (verified via `pip download --python-version 311
    # --platform manylinux2014_aarch64`) and satisfies scipy's own
    # numpy>=2.0 requirement.
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "ruff==0.8.0",
    "mypy==1.13.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
# Matches this project's actual Python 3.11 constraint (SRS §6). Earlier
# in Phase 2 this was temporarily bumped to 3.12 to work around
# numpy>=2.5's PEP 695 stub syntax — that numpy version turned out to be
# uninstallable on Python 3.11 at all (see the numpy pin's comment
# above), so pinning numpy to 2.2.6 fixed both problems at once and this
# setting could revert to the project's real target.
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = [
    "passlib.*",
    "jose.*",
    "pgvector.*",
    "pdfplumber.*",
    "docx.*",
    "docx.opc.*",
    "bs4.*",
    "nltk.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Explicit default (rather than relying on pytest-asyncio's own default,
# which it warns is changing in a future release). Function-scoped loops
# are fine here because _fresh_db_engine_per_test (tests/conftest.py)
# creates a new DB engine per test regardless of loop scope, so there's
# no cross-test event-loop/connection mismatch to guard against.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[project]
name = "rag-assistant"
version = "0.1.0"
description = "Production RAG Knowledge Assistant"
requires-python = ">=3.11,<3.12"
readme = "README.md"

# NOTE: This is the Phase 1 dependency set only (project foundation:
# FastAPI + PostgreSQL + JWT auth + observability + CI). Parsing,
# embedding, retrieval, generation, and evaluation dependencies
# (openai, anthropic, tiktoken, nltk, rank-bm25, pdfplumber,
# python-docx, beautifulsoup4, lxml, ragas, python-multipart) are
# intentionally deferred to the phases that introduce them, per
# docs/IMPLEMENTATION_PLAN.md.
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    # Pinned explicitly (not left to passlib's [bcrypt] extra, which has no
    # upper bound): passlib 1.7.4's internal self-test passes a >72-byte
    # dummy secret to bcrypt. bcrypt<4.1 silently truncated at 72 bytes;
    # bcrypt>=4.1 raises ValueError instead, breaking every password
    # verification. Confirmed by running the test suite locally.
    "bcrypt==4.0.1",
    # Required by FastAPI/Starlette to parse Form(...) fields for
    # POST /auth/token, which README.md documents as form-encoded.
    # Pulled forward from its originally-planned Phase 2 introduction
    # (multipart file upload) because Phase 1 needs it too.
    "python-multipart==0.0.12",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "ruff==0.8.0",
    "mypy==1.13.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["tests/", "migrations/"]

[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The DB engine (src/db/session.py) is process-cached via lru_cache, as it
# is in production under uvicorn's single event loop. Function-scoped test
# event loops (pytest-asyncio's default) would create asyncpg connections
# on one loop and tear them down on another between tests. Session-scoped
# loop matches production's single-loop lifetime and avoids that mismatch.
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

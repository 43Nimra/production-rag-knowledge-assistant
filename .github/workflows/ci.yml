name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (with dev extras)
        run: pip install --break-system-packages -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src/ config.py

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag_db
      JWT_SECRET_KEY: ci-test-secret-key
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (with dev extras)
        run: pip install --break-system-packages -e ".[dev]"

      - name: Download NLTK sentence-tokenizer data
        run: python -m nltk.downloader punkt_tab

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov=src -v

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t rag-assistant:ci .
